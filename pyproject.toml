[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "x12-doctor"
version = "0.1.0"
description = "Diagnose rejected and malformed ANSI X12 EDI documents, in plain English."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Olevis LLC" }]
keywords = [
    "edi",
    "x12",
    "validation",
    "diagnostics",
    "supply-chain",
    "850",
    "856",
    "810",
    "997",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Manufacturing",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Office/Business",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Text Processing",
    "Typing :: Typed",
]
# Zero runtime dependencies, deliberately. See docs/design.md.
dependencies = []

[project.urls]
Homepage = "https://github.com/Adeloi-Official/x12-doctor"
Repository = "https://github.com/Adeloi-Official/x12-doctor"
Issues = "https://github.com/Adeloi-Official/x12-doctor/issues"
Changelog = "https://github.com/Adeloi-Official/x12-doctor/blob/main/CHANGELOG.md"

[project.scripts]
x12doctor = "x12doctor.cli:main"
x12-doctor = "x12doctor.cli:main"

[project.entry-points.pytest11]
x12doctor = "x12doctor.pytest_plugin"

[project.optional-dependencies]
dev = ["pytest>=8.0", "mypy>=1.11", "ruff>=0.6"]

[tool.hatch.build.targets.wheel]
packages = ["src/x12doctor"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/test", "/docs", "/tools", "/README.md", "/LICENSE", "/NOTICE"]

[tool.pytest.ini_options]
testpaths = ["test"]
addopts = "-q"

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/x12doctor"]
warn_unreachable = true
disallow_any_explicit = false

[tool.ruff]
line-length = 88
target-version = "py311"
src = ["src", "test"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # bugbear
    "C4",   # comprehensions
    "SIM",  # simplify
    "RUF",  # ruff-specific
]
ignore = [
    "E501",    # line length is handled by the formatter
    "SIM108",  # ternaries are not always clearer than an if/else
]

[tool.ruff.lint.per-file-ignores]
"test/*" = ["E402"]
# The public API's __all__ is grouped by topic with comments, which reads far
# better than alphabetical order for someone scanning what the package offers.
"src/x12doctor/__init__.py" = ["RUF022"]

[tool.coverage.run]
source = ["src/x12doctor"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    'if __name__ == "__main__":',
]
