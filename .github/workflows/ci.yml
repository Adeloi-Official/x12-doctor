name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Lint
        run: python -m ruff check .

      - name: Type check
        run: python -m mypy

      - name: Test
        run: python -m pytest

      - name: Check generated docs are current
        run: python tools/gen-docs.py --check

  # The corpus is committed so the suite above needs no Node. This job proves
  # the committed files are what edi-fixtures actually produces, rather than
  # something hand-edited into passing.
  corpus:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: x12-doctor

      - uses: actions/checkout@v4
        with:
          repository: Adeloi-Official/edi-fixtures
          path: edi-fixtures

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build edi-fixtures
        working-directory: edi-fixtures
        run: |
          npm ci
          npm run build

      - name: Regenerate the corpus
        working-directory: x12-doctor
        run: node tools/build-corpus.mjs --fixtures ../edi-fixtures

      - name: The committed corpus must match
        working-directory: x12-doctor
        run: |
          if ! git diff --quiet -- test/corpus; then
            echo "::error::test/corpus differs from what edi-fixtures generates."
            echo "Run 'node tools/build-corpus.mjs' and commit the result."
            git diff --stat -- test/corpus
            exit 1
          fi
